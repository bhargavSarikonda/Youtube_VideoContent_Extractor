version: '3.8'

services:
  # 1. High-Performance Redis Cluster Node (Broker & Cache & Rate Limiter)
  redis:
    image: redis:7-alpine
    container_name: yt_extractor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: always

  # 2. FastAPI ASGI Application Server
  api:
    build: .
    container_name: yt_extractor_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    restart: always
    volumes:
      - ./generated_reports:/app/generated_reports

  # 3. Distributed Celery Worker Fleet (Concurrent DAG Engine)
  celery_worker:
    build: .
    container_name: yt_extractor_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=16 -Q celery
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    restart: always
    volumes:
      - ./generated_reports:/app/generated_reports

volumes:
  redis_data:
